<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GOOD EVENING🌅</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }


        /* =========================
           GOOD MORNING PAGE
        ========================= */

        #morningPage {

            position: fixed;
            inset: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #ff9966,
                    #ff5e62,
                    #ffcc70
                );

            color: white;

            z-index: 10;

            transition: opacity 1s ease;
        }


        #morningPage.hide {
            opacity: 0;
            pointer-events: none;
        }


        .morning-box {
            width: 90%;
            max-width: 600px;
        }


        .sun {

            font-size: 90px;

            animation:
                sunAnimation 2s infinite ease-in-out;
        }


        @keyframes sunAnimation {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }

        }


        h1 {

            margin-top: 20px;

            font-size: clamp(
                40px,
                8vw,
                70px
            );

            letter-spacing: 3px;

            text-shadow:
                0 4px 15px
                rgba(0,0,0,0.3);
        }


        .subtitle {

            margin-top: 15px;

            font-size: 28px;

            letter-spacing: 2px;
        }


        .message {

            margin-top: 15px;

            font-size: 18px;

            opacity: 0.9;
        }


        .loading {

            width: 45px;
            height: 45px;

            margin: 30px auto 0;

            border: 4px solid
                rgba(255,255,255,0.4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                loading 1s linear infinite;
        }


        @keyframes loading {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           VIDEO PAGE
        ========================= */

        #videoPage {

            position: fixed;
            inset: 0;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #000;

            opacity: 0;
            visibility: hidden;

            transition: opacity 1s ease;

            z-index: 5;
        }


        #videoPage.show {

            opacity: 1;
            visibility: visible;
        }


        .video-container {

            position: relative;

            width: 100%;
            height: 100%;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        iframe {

            width: min(430px, 100vw);

            height: min(760px, 100vh);

            border: none;

            border-radius: 12px;

            background: #000;
        }


        /* =========================
           START BUTTON
        ========================= */

        #startButton {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            padding: 18px 35px;

            border: none;

            border-radius: 50px;

            background: white;

            color: black;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            z-index: 20;

            box-shadow:
                0 10px 40px
                rgba(255,255,255,0.3);

            transition: 0.3s;
        }


        #startButton:hover {

            transform:
                translate(-50%, -50%)
                scale(1.08);
        }


        #startButton.hide {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            iframe {

                width: 100vw;
                height: 100vh;

                border-radius: 0;
            }

        }

    </style>

</head>


<body>


    <section id="morningPage">

        <div class="morning-box">

            <div class="sun">
                🌙
            </div>

            <h1>
                GOOD EVENING
            </h1>

            <div class="subtitle">
                HAVE A NICE DAY 🌙
            </div>

            <div class="message">
                Wishing you a beautiful day ❤️
            </div>

            <div class="loading"></div>

        </div>

    </section>



    <!-- =========================
         VIDEO PAGE
    ========================= -->

    <section id="videoPage">

        <div class="video-container">

            <iframe
                id="youtubeVideo"
                title="YouTube Video"
                allow="autoplay; encrypted-media; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>


            <button id="startButton">
                ▶ BHUPENDRA 
            </button>

        </div>

    </section>



    <script>

        /* =========================
           VIDEO ID
        ========================= */

        const videoID = "m6AHLwOs26o";


        /* =========================
           ELEMENTS
        ========================= */

        const morningPage =
            document.getElementById(
                "morningPage"
            );

        const videoPage =
            document.getElementById(
                "videoPage"
            );

        const youtubeVideo =
            document.getElementById(
                "youtubeVideo"
            );

        const startButton =
            document.getElementById(
                "startButton"
            );


        /* =========================
           AFTER 2 SECONDS
        ========================= */

        setTimeout(function () {

            /*
             * IMPORTANT:
             * No autoplay here.
             * Therefore video will NOT start.
             */

            youtubeVideo.src =
                "https://www.youtube.com/embed/"
                + videoID
                + "?rel=0"
                + "&playsinline=1";


            /* Show video page */

            videoPage.classList.add(
                "show"
            );


            /* Hide morning page */

            morningPage.classList.add(
                "hide"
            );


        }, 2000);



        /* =========================
           START BUTTON CLICK
        ========================= */

        startButton.addEventListener(
            "click",
            function () {

                /*
                 * User has clicked.
                 * Now autoplay with sound is allowed.
                 */

                youtubeVideo.src =
                    "https://www.youtube.com/embed/"
                    + videoID
                    + "?autoplay=1"
                    + "&mute=0"
                    + "&rel=0"
                    + "&playsinline=1";


                /* Hide button */

                startButton.classList.add(
                    "hide"
                );

            }
        );

    </script>

</body>
</html>
